<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#3b82f6;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#a855f7;#06b6d4;#ec4899" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="glowPulse1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
      <animate attributeName="r" values="35%;48%;35%" dur="8s" repeatCount="indefinite" />
    </radialGradient>

    <radialGradient id="glowPulse2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
      <animate attributeName="r" values="40%;55%;40%" dur="9s" repeatCount="indefinite" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#4f46e5" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Ambient Glow Spheres (Background) -->
  <circle cx="240" cy="140" r="280" fill="url(#glowPulse1)" />
  <circle cx="960" cy="280" r="320" fill="url(#glowPulse2)" />

  <!-- Animated Data Flow Pipelines (Midground - Behind Foreground Text) -->
  <g opacity="0.6">
    <!-- Pipeline Flow 1 -->
    <path d="M 60 90 Q 300 30 600 80 T 1140 70" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite" />
    </path>
    <!-- Pipeline Flow 2 -->
    <path d="M 60 350 Q 300 400 600 340 T 1140 360" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="10 10" opacity="0.35">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="6s" repeatCount="indefinite" />
    </path>
    <!-- Cross Connecting Arc -->
    <path d="M 180 80 C 180 320, 1020 80, 1020 320" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25">
      <animate attributeName="stroke-dashoffset" from="60" to="0" dur="7s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Floating Pipeline Indicator Orbs (Midground) -->
  <circle cx="180" cy="80" r="5" fill="#6366f1">
    <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="80" r="6" fill="#8b5cf6">
    <animate attributeName="r" values="5;8;5" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="70" r="5" fill="#ec4899">
    <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Content Container with subtle backdrop shield -->
  <g transform="translate(60, 45)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="350" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="font-mono" font-size="12" fill="#c7d2fe" letter-spacing="1">CURATED PLATFORMS &amp; AGENTS</text>
    </g>

    <!-- Main Title (Crisp, High Contrast Foreground) -->
    <text x="0" y="95" class="font-title" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      Awesome Generative AI
    </text>
    <text x="0" y="148" class="font-title" font-size="42" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Content Marketing Platforms
    </text>

    <!-- Subtitle (Clear Foreground Description) -->
    <text x="0" y="195" class="font-sub" font-size="18" fill="#94a3b8">
      Top Enterprise SaaS &amp; Open-Source Engines for Brand Voice, Multi-Agent Pipelines &amp; Autonomous Campaigns
    </text>

    <!-- Horizontal Divider -->
    <line x1="0" y1="225" x2="1080" y2="225" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

    <!-- Feature Pillars / Badges (Interactive Modern Card Aesthetic) -->
    <!-- Card 1 -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="250" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#6366f1" />
      <text x="16" y="25" class="font-title" font-size="14" fill="#f8fafc">🤖 Multi-Agent CMO</text>
      <text x="16" y="44" class="font-sub" font-size="12" fill="#94a3b8">Autonomous content factories</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(275, 248)">
      <rect x="0" y="0" width="250" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#8b5cf6" />
      <text x="16" y="25" class="font-title" font-size="14" fill="#f8fafc">🛡️ Brand Voice AI</text>
      <text x="16" y="44" class="font-sub" font-size="12" fill="#94a3b8">Deterministic style &amp; guardrails</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(550, 248)">
      <rect x="0" y="0" width="250" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#06b6d4" />
      <text x="16" y="25" class="font-title" font-size="14" fill="#f8fafc">🏠 Self-Hosted &amp; Sovereign</text>
      <text x="16" y="44" class="font-sub" font-size="12" fill="#94a3b8">Local models, zero vendor lock-in</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(825, 248)">
      <rect x="0" y="0" width="255" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#ec4899" />
      <text x="16" y="25" class="font-title" font-size="14" fill="#f8fafc">📊 Predictive Scoring</text>
      <text x="16" y="44" class="font-sub" font-size="12" fill="#94a3b8">CTR, engagement &amp; ROAS uplift</text>
    </g>
  </g>
</svg>